<svg width="100%" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Dark cinematic background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="360">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>

    <!-- Logo Gradient (Back to the Future style) -->
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff200"/>
      <stop offset="50%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#ff0000"/>
    </linearGradient>

    <!-- Neon glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- Speed Trails -->
  <g stroke="#00eaff" stroke-width="3" opacity="0.7" filter="url(#glow)">
    <line x1="0" y1="260" x2="1200" y2="260">
      <animate attributeName="x1" values="0;1200" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1200;2400" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="280" x2="1200" y2="280">
      <animate attributeName="x1" values="0;1200" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1200;2400" dur="1.8s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Fire Road Effect -->
  <rect x="0" y="300" width="1200" height="6" fill="#ff5a00">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Flash Warp -->
  <rect width="1200" height="360" fill="white" opacity="0">
    <animate attributeName="opacity" values="0;0.2;0" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Main Title -->
  <g transform="translate(600,160) skewX(-15)">
    <text text-anchor="middle"
          font-size="72"
          font-weight="900"
          font-family="Arial Black, sans-serif"
          fill="url(#logoGrad)"
          filter="url(#glow)">
      ANDIKA NUGRAHA
    </text>
  </g>

  <!-- Name under it -->
  <text x="600" y="210"
        text-anchor="middle"
        font-size="22"
        font-family="Arial, sans-serif"
        fill="#cccccc">
    dikag0d
  </text>

  <!-- Time Circuit Style Text -->
  <text x="600" y="240"
        text-anchor="middle"
        font-size="18"
        font-family="Courier New, monospace"
        fill="#00ff66">
    IoT, Fullstack , Hardware, Network 
  </text>

</svg>
